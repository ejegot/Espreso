apply plugin: 'com.android.application'

def hasElilaiReleaseSigning =
    (project.findProperty("ELILAI_KAFE_UPLOAD_STORE_FILE") ?: "") != "" &&
    (project.findProperty("ELILAI_KAFE_UPLOAD_STORE_PASSWORD") ?: "") != "" &&
    (project.findProperty("ELILAI_KAFE_UPLOAD_KEY_ALIAS") ?: "") != "" &&
    (project.findProperty("ELILAI_KAFE_UPLOAD_KEY_PASSWORD") ?: "") != ""

android {
    namespace = "ph.elilai.kafe"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ph.elilai.kafe"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasElilaiReleaseSigning) {
                storeFile file(ELILAI_KAFE_UPLOAD_STORE_FILE)
                storePassword ELILAI_KAFE_UPLOAD_STORE_PASSWORD
                keyAlias ELILAI_KAFE_UPLOAD_KEY_ALIAS
                keyPassword ELILAI_KAFE_UPLOAD_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasElilaiReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Cap CLI regenerates assets/capacitor.plugins.json from npm packages only.
// Local EscPosPrinterPlugin is also registered in MainActivity; merge this file so
// PluginManager discovery includes it at Bridge create (PluginHeaders / Cap.Plugins).
tasks.register("mergeLocalCapacitorPlugins") {
    description = "Merge local Capacitor plugin classpaths into capacitor.plugins.json"
    def generated = file("src/main/assets/capacitor.plugins.json")
    def localExtras = file("capacitor.plugins.local.json")
    inputs.files(generated, localExtras)
    outputs.file(generated)
    doLast {
        if (!localExtras.exists()) {
            return
        }
        def slurper = new groovy.json.JsonSlurper()
        def extras = slurper.parse(localExtras)
        if (!(extras instanceof List) || extras.isEmpty()) {
            return
        }
        def existing = generated.exists() ? slurper.parse(generated) : []
        if (!(existing instanceof List)) {
            existing = []
        }
        def byClasspath = new LinkedHashMap<String, Object>()
        existing.each { entry ->
            if (entry instanceof Map && entry.classpath) {
                byClasspath[entry.classpath.toString()] = entry
            }
        }
        extras.each { entry ->
            if (entry instanceof Map && entry.classpath) {
                byClasspath[entry.classpath.toString()] = entry
            }
        }
        def merged = new ArrayList(byClasspath.values())
        generated.parentFile.mkdirs()
        generated.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(merged)) + "\n"
    }
}

tasks.named("preBuild").configure { dependsOn("mergeLocalCapacitorPlugins") }

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
